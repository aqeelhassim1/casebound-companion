<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dead Air - Phone</title><style>:root{
  --bg:#0b0f14; --panel:#12181f; --panel2:#18222c; --ink:#e8e2d4; --dim:#9aa7b4;
  --amber:#e8a33d; --teal:#5db8d6; --red:#c9524f; --line:#2a3642;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.bg-art{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 62%,rgba(4,8,12,.18) 0%,rgba(4,8,12,.78) 100%);z-index:1}
.content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3vh 4vw;text-align:center}
.kicker{letter-spacing:.42em;font-size:clamp(11px,1.1vw,15px);color:var(--amber);text-transform:uppercase}
h1.title{font-size:clamp(34px,5.2vw,84px);letter-spacing:.08em;font-weight:700;margin:1.2vh 0;text-shadow:0 4px 28px rgba(0,0,0,.8)}
.sub{color:var(--dim);font-size:clamp(14px,1.4vw,20px);max-width:60ch;line-height:1.5}
.btn{display:inline-block;background:var(--amber);color:#14100a;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 34px;border-radius:8px;font-size:clamp(13px,1.1vw,17px);box-shadow:0 6px 24px rgba(232,163,61,.25);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(232,163,61,.35)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--amber)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.diff{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 22px;min-width:170px;transition:border-color .12s,background .12s}
.diff b{display:block;font-size:16px;letter-spacing:.06em;margin-bottom:4px}
.diff span{color:var(--dim);font-size:12.5px;line-height:1.35;display:block}
.diff.sel{border-color:var(--amber);background:var(--panel2)}
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(rgba(4,8,12,.72),transparent)}
.chip{background:rgba(10,16,22,.78);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.timer{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.1em;color:var(--amber)}
.spacer{flex:1}
.iconbtn{background:rgba(10,16,22,.78);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.iconbtn:hover{border-color:var(--amber)}
.iconbtn.on{border-color:var(--teal);color:var(--teal)}
.hotspot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);z-index:3;cursor:pointer}
.hotspot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(232,163,61,0);transition:border-color .15s,box-shadow .15s}
.hotspot:hover::after,.hotspot:focus::after{border-color:rgba(232,163,61,.85);box-shadow:0 0 22px rgba(232,163,61,.35) inset,0 0 18px rgba(232,163,61,.25)}
.hotspot.done::after{border-color:rgba(127,176,105,.55)}
.modalwrap{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(3,6,10,.66);padding:3vh 3vw}
.modalwrap.on{display:flex}
.card-horizontal{display:flex;flex-direction:row;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:min(1180px,92vw);max-height:86vh;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.card-art{flex:1.15;min-width:0;background:#05080c;display:flex;align-items:center;justify-content:center}
.card-art img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{flex:1;padding:26px 28px;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:300px;overflow:auto}
.card-body h2{font-size:clamp(18px,1.8vw,26px);letter-spacing:.05em}
.card-body .tag{color:var(--amber);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.card-body p{color:var(--ink);font-size:clamp(14px,1.25vw,17.5px);line-height:1.55}
.card-body .note{color:var(--dim);font-size:13.5px;line-height:1.5;font-style:italic}
.card-actions{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;padding-top:8px}
.toast{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:40;background:rgba(14,20,27,.95);border:1px solid var(--amber);color:var(--ink);border-radius:10px;padding:13px 22px;font-size:clamp(13px,1.15vw,16px);max-width:72vw;text-align:center;display:none;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.toast.on{display:block;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.caption{pointer-events:none;position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);z-index:6;background:rgba(4,8,12,.82);border-radius:10px;padding:12px 24px;max-width:76vw;text-align:center;font-size:clamp(15px,1.5vw,22px);line-height:1.45;display:none}
.caption.on{display:block}
.caption .who{color:var(--amber);letter-spacing:.18em;font-size:.68em;text-transform:uppercase;display:block;margin-bottom:4px}
.kenburns{animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.07) translate(-1.2%,1%)}}
@media (prefers-reduced-motion:reduce){.kenburns{animation:none}}
.nomotion .kenburns{animation:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,88vw);z-index:18;background:rgba(10,15,21,.97);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer h3{padding:18px 20px 8px;letter-spacing:.2em;font-size:13px;color:var(--amber);text-transform:uppercase}
.casefile{flex:1;overflow:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:10px}
.evitem{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:left}
.evitem img{width:74px;height:52px;object-fit:cover;border-radius:6px}
.evitem b{display:block;font-size:14px}
.evitem span{color:var(--dim);font-size:12px;line-height:1.35;display:block}
.evitem .saved{margin-left:auto;color:#7fb069;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.qrpanel{background:rgba(10,16,22,.85);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;text-align:left}
.qrpanel img{width:150px;height:150px;border-radius:8px;background:#e8e2d4}
.qrpanel .u{font-size:15px;word-break:break-all;color:var(--teal)}
.qrpanel .c{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.players{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin:10px 0}
.keypad button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:24px;padding:14px 0;font-variant-numeric:tabular-nums}
.keypad button:hover{border-color:var(--amber)}
.codeout{font-size:34px;letter-spacing:.5em;text-align:center;font-variant-numeric:tabular-nums;color:var(--amber);min-height:44px;padding-left:.5em}
.mixer{display:flex;flex-direction:column;gap:12px}
.track{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.track.solo{border-color:var(--amber)}
.track .nm{width:96px;text-align:left;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.track.solo .nm{color:var(--amber)}
.track canvas{flex:1;height:54px;background:#070b10;border-radius:6px}
.track .solo-btn{border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.track .solo-btn:hover{border-color:var(--amber)}
.digits{display:flex;gap:10px;justify-content:center;margin-top:6px}
.digits .d{background:#0d141c;border:1px solid var(--amber);color:var(--amber);border-radius:8px;font-size:26px;padding:8px 14px;font-variant-numeric:tabular-nums}
.tuner{display:flex;align-items:center;gap:16px;justify-content:center;margin:14px 0}
.tuner .freq{font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:.08em;color:var(--amber);min-width:220px;text-align:center;text-shadow:0 0 24px rgba(232,163,61,.35)}
.tuner .step{display:flex;flex-direction:column;gap:8px}
.tuner .step button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:52px;height:40px;font-size:20px}
.tuner .step button:hover{border-color:var(--amber)}
.wavebig{width:100%;height:110px;background:#070b10;border-radius:10px;border:1px solid var(--line)}
.small{font-size:12.5px;color:var(--dim);line-height:1.5}
.center-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.briefcard{background:rgba(12,18,25,.88);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:250px;text-align:left}
.briefcard b{display:block;margin-bottom:6px;letter-spacing:.06em}
.briefcard p{color:var(--dim);font-size:13.5px;line-height:1.5}
.glowpulse{animation:gp 2.2s ease-in-out infinite}
@keyframes gp{0%,100%{box-shadow:0 0 0 rgba(201,82,79,.0)}50%{box-shadow:0 0 34px rgba(201,82,79,.55)}}
@media (max-width:820px){
  .card-horizontal{flex-direction:column;max-height:92vh}
  .card-art img{max-height:38vh}
  .keypad{grid-template-columns:repeat(3,72px)}
}

/* ---- v0.9 ---- */
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);aspect-ratio:16/9;z-index:0;overflow:hidden}
.stageart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hs{position:absolute;z-index:3;border-radius:14px;border:2px solid transparent;transition:border-color .15s,box-shadow .15s,background .15s}
.hs span{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:rgba(6,10,14,.9);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;letter-spacing:.06em;opacity:0;transition:opacity .15s;pointer-events:none}
.hs:hover,.hs:focus-visible{border-color:rgba(232,163,61,.85);box-shadow:0 0 26px rgba(232,163,61,.3) inset;background:rgba(232,163,61,.06)}
.hs:hover span,.hs:focus-visible span{opacity:1}
.hs.done{border-color:rgba(127,176,105,.45)}
.diff-casual .hs:not(.done){border-color:rgba(232,163,61,.4);animation:hsglow 2.6s ease-in-out infinite}
@keyframes hsglow{0%,100%{box-shadow:0 0 0 rgba(232,163,61,0) inset}50%{box-shadow:0 0 22px rgba(232,163,61,.28) inset}}
.nomotion .diff-casual .hs{animation:none}
.diff-mastermind .hs.done{border-color:transparent}
.hs.dev:not(.done){}
.goal{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:4;background:rgba(6,10,14,.78);border:1px solid var(--line);border-radius:8px;padding:7px 16px;font-size:clamp(12px,1.05vw,15px);color:var(--dim);letter-spacing:.03em;max-width:80vw;text-align:center}
.crop{width:100%;height:100%;min-height:340px;background-repeat:no-repeat}
.paper{background:#ece3cf;color:#1d1a14;border-radius:4px;padding:16px 18px;font-family:"Courier New",Courier,monospace;font-size:clamp(13px,1.15vw,16.5px);line-height:1.55;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.paper.object,.paper.photo{background:#18222c;color:var(--ink);font-family:inherit}
.devcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 28px;max-width:min(980px,94vw);max-height:90vh;overflow:auto;text-align:left;box-shadow:0 24px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px}
.devcard h2{font-size:clamp(18px,1.8vw,26px);letter-spacing:.05em}
.devcard .tag{color:var(--amber);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.devp{color:var(--ink);font-size:clamp(14px,1.2vw,17px);line-height:1.5;margin:4px 0 8px}
.devlabel{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:10px 0 6px}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:14px}
.opt:hover{border-color:var(--amber)}
.opt.sel{border-color:var(--amber);color:var(--amber);background:#221a0f}
.opt.warn{border-color:var(--red);color:#f0a09c;background:#2a1414}
.patchrow{display:flex;flex-direction:column;margin-bottom:4px}
.devactions{display:flex;justify-content:center;gap:10px;margin-top:14px}
.tuner .freq small{font-size:18px;color:var(--dim)}
.breakers{display:flex;gap:16px;justify-content:center;margin:10px 0}
.breaker{width:120px;height:170px;background:#1a2129;border:2px solid var(--line);border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px}
.breaker .lever{position:absolute;left:50%;top:18px;width:26px;height:70px;margin-left:-13px;background:#555;border-radius:6px;transition:transform .2s}
.breaker.on .lever{background:var(--amber);transform:translateY(0)}
.breaker:not(.on) .lever{transform:translateY(40px)}
.breaker b{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.breaker i{font-style:normal;font-size:12px;color:var(--dim)}
.breaker.on i{color:var(--amber)}
.center{text-align:center}
.hatchplate{position:relative;width:300px;height:300px;margin:10px auto;background:linear-gradient(135deg,#3b3f44,#23272b);border:3px solid #555;border-radius:8px}
.bolt{position:absolute;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#9aa0a6,#4a4f55);border:3px solid #222;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111}
.bolt b{font-size:14px}.bolt i{font-style:normal;font-size:20px;font-weight:700;color:var(--amber)}
.bolt.out{background:radial-gradient(circle,#1b1e21,#0d0f11);color:var(--dim)}
.b-nw{left:14px;top:14px}.b-ne{right:14px;top:14px}.b-sw{left:14px;bottom:14px}.b-se{right:14px;bottom:14px}
.accusebox{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:6;background:rgba(10,15,21,.93);border:1px solid var(--line);border-radius:14px;padding:18px 24px;width:min(1100px,94vw);max-height:78vh;overflow:auto}
.suspects{display:flex;gap:14px;justify-content:center}
.suspect{flex:1;max-width:320px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding-bottom:10px}
.suspect img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-bottom:8px}
.suspect b{display:block;padding:0 12px;font-size:16px}.suspect span{display:block;padding:2px 12px 0;color:var(--dim);font-size:12.5px}
.suspect.sel{border-color:var(--amber)}
.proofs .opt{font-size:13px;padding:8px 12px}
.cfhead{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);margin:10px 2px 0}
.evitem.col{flex-direction:column;align-items:flex-start;gap:6px}
.evitem.col span{font-size:12px}
.beat .shots{position:absolute;inset:0;overflow:hidden;background:#000}
.beat .shot{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;will-change:transform,opacity}
.beattitle{position:absolute;top:22px;left:28px;z-index:10;letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--amber);background:rgba(4,8,12,.6);padding:6px 12px;border-radius:6px}
.beatbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:14px;padding:10px 20px;background:linear-gradient(transparent,rgba(3,6,10,.85))}
.beatbar canvas{width:340px;height:36px}
.bprog{flex:1;height:3px;background:#2a3642;border-radius:2px}.bprog i{display:block;height:100%;width:0;background:var(--amber)}
.bcap{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);z-index:10;background:rgba(4,8,12,.84);border-radius:10px;padding:14px 26px;max-width:78vw;text-align:center;font-size:clamp(17px,1.75vw,27px);line-height:1.42;opacity:0;transition:opacity .25s}
.bcap.on{opacity:1}
.bcap .who,.beatcard .who{color:var(--amber);letter-spacing:.18em;font-size:.6em;text-transform:uppercase;display:block;margin-bottom:6px}
.bcap .fx{color:var(--dim);font-style:italic}
.beatcard{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12vw;font-size:clamp(20px,2.2vw,34px);line-height:1.45;background:rgba(3,6,10,.62);opacity:0;transition:opacity .6s}
.beatcard.on{opacity:1}
@media (max-width:520px){.tuner{gap:8px}.tuner .freq{font-size:38px;min-width:0;flex:1}.tuner .step button{width:46px;height:40px;font-size:18px}.pcard .optrow{flex-wrap:wrap}}
.pwrap{padding-bottom:96px}

/* ---- v1.0 ---- */
.fader{display:flex;align-items:center;gap:8px}
.fader button{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:44px;height:40px;font-size:22px}
.fader button:hover{border-color:var(--amber)}
.fader .lvl{display:flex;gap:3px}
.fader .lvl i{width:9px;height:26px;border-radius:2px;background:#26313c}
.fader .lvl i.on{background:var(--amber)}
.track .scope{flex:1;height:54px;background:#070b10;border-radius:6px;min-width:120px}
.isocap{margin-top:10px;background:#070b10;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-family:"Courier New",monospace;font-size:clamp(14px,1.3vw,18px);color:#6f7d8a;min-height:52px;text-align:center}
.isocap.clear{color:var(--ink);border-color:var(--amber)}
.panels{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.panelbtn{background:#1e252c;border:1px solid var(--line);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.panelbtn b{font-size:20px}
.panelbtn.sel{border-color:var(--amber)}
.panelbtn canvas{width:100%;height:50px;border-radius:4px}
.wheels{display:flex;gap:18px;justify-content:center;margin:10px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:6px;background:#2a2317;border:1px solid #6b5630;border-radius:12px;padding:8px 14px}
.wheel b{font-size:40px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.wheel button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:56px;height:38px}
.lamp{display:inline-flex;align-items:center;padding:10px 14px;border-radius:8px;background:#1a1f24;border:1px solid var(--line);font-size:12px;letter-spacing:.2em;color:var(--dim)}
.lamp.amber{color:var(--amber);border-color:var(--amber)}
.lamp.green{color:#8fe08a;border-color:#5fbf5a;box-shadow:0 0 14px rgba(95,191,90,.4)}
.stage.dark .stageart{filter:brightness(.32) saturate(.7)}
.stage.dark::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 88% 30%,rgba(255,220,160,.12),rgba(0,0,0,0) 22%)}
.ollie{position:fixed;left:2vw;bottom:4vh;z-index:7;display:flex;gap:14px;align-items:flex-end;max-width:min(640px,60vw);pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s}
.ollie.on{opacity:1;transform:none}
.ollie img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid var(--amber);box-shadow:0 6px 24px rgba(0,0,0,.6)}
.ollie .bub{background:rgba(6,10,14,.92);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:clamp(14px,1.3vw,19px);line-height:1.45}
.ollie .bub b{display:block;color:var(--amber);letter-spacing:.2em;font-size:.65em;text-transform:uppercase;margin-bottom:3px}
.arrival .shot{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}
.arrival .shot.on{opacity:1}
.arrival .acap{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);z-index:4;max-width:70vw;text-align:center;font-size:clamp(16px,1.8vw,26px);text-shadow:0 2px 14px #000;opacity:0;transition:opacity .6s}
.arrival .acap.on{opacity:1}

body{overflow:auto}
.pwrap{max-width:560px;margin:0 auto;padding:18px 16px 90px;display:flex;flex-direction:column;gap:14px}
.ptitle{text-align:center;padding:14px 0 2px}
.sect{letter-spacing:.28em;font-size:11px;color:var(--amber);text-transform:uppercase;margin:8px 2px 2px}
.evboard{display:flex;flex-direction:column;gap:10px}
.ctlbar{position:fixed;left:0;right:0;bottom:0;background:rgba(8,13,19,.97);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:30}
.ctlbar .grow{flex:1}
.bigbtn{background:var(--amber);color:#14100a;font-weight:700;border-radius:10px;padding:12px 18px;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.bigbtn.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
input.txt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:13px 14px;font-size:16px;width:100%}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.timerline{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px;padding:2px 4px}
.timerline b{color:var(--amber);font-variant-numeric:tabular-nums}

<script>window.DA_ART_BASE="../art/";window.DA_BEATS=[{"id": 0, "title": "The Late Shift", "dur": 50, "sfx": "arrival", "shots": [{"art": "title-storm", "t": 0, "kb": [1.0, 1.08, 0, 0, -1, 1]}, {"art": "wnhc-1986", "t": 12, "kb": [1.06, 1.0, 1, -1, 0, 0]}, {"art": "scene-corridor", "t": 24, "kb": [1.0, 1.07, 0, 0, -1.5, 0]}, {"art": "ollie", "t": 34, "kb": [1.04, 1.0, 0, 0, 0, -1]}, {"art": "scene-studio", "t": 43, "kb": [1.0, 1.05, 0, 0, 1, 0]}], "lines": [{"t": 0.6, "d": 3.0, "who": null, "text": "[rain on a windshield; a car door; wind off the harbor]", "v": "fx"}, {"t": 4.0, "d": 6.8, "who": null, "text": "Marrow Bay. March 3, 1996. 11:40 PM.", "v": "card"}, {"t": 12.4, "d": 5.6, "who": null, "text": "Ten years ago tonight, WNHC 88.7 burned in a storm. A DJ named Michelle Spencer was never found.", "v": "card"}, {"t": 18.6, "d": 4.8, "who": null, "text": "They built WMBY - The Bay - on the same ground. Tonight is its tenth anniversary.", "v": "card"}, {"t": 24.2, "d": 3.2, "who": null, "text": "[a heavy fire door; footsteps on a wet floor]", "v": "fx"}, {"t": 28.0, "d": 5.0, "who": "Ollie Park", "text": "You're the overnight crew? Ollie. I'm the engineer. Harbor line's down, so I drove in.", "v": "ollie"}, {"t": 33.6, "d": 4.6, "who": "Ollie Park", "text": "I kept the old station running, back when it was WNHC. I was on the board the night of the fire.", "v": "ollie"}, {"t": 38.8, "d": 4.0, "who": "Ollie Park", "text": "The meter on eighty-eight seven has been twitching since ten.", "v": "ollie", "hit": true}, {"t": 43.4, "d": 5.4, "who": "Ollie Park", "text": "Nobody's licensed on that frequency. Come on. I'll show you the studio.", "v": "ollie"}]}, {"id": 1, "title": "The Voice on 88.7", "dur": 42, "shots": [{"art": "beat-signal", "t": 0, "kb": [1.0, 1.08, 0, 0, -1.5, 1]}, {"art": "michelle-1986", "t": 17, "kb": [1.06, 1.0, 1, -1, 0, 0]}, {"art": "title-storm", "t": 34, "kb": [1.0, 1.05, 0, 0, 0, -1]}], "lines": [{"t": 0.6, "d": 2.8, "who": "88.7 FM", "text": "[static swells, then parts like a curtain]", "v": "fx"}, {"t": 3.6, "d": 4.6, "who": "The voice on 88.7", "text": "...WNHC, eighty-eight point seven... is anyone still at the board?", "v": "m"}, {"t": 8.6, "d": 4.2, "who": "The voice on 88.7", "text": "This is Michelle Spencer. Night Tide. I never got off the air.", "v": "m"}, {"t": 13.2, "d": 4.8, "who": "Michelle Spencer", "text": "Ten years tonight. They told this town it was the storm. Lights in the windows. A curse.", "v": "m"}, {"t": 18.6, "d": 4.4, "who": "Michelle Spencer", "text": "It wasn't the storm. Someone killed me in this building.", "v": "m", "hit": true}, {"t": 23.6, "d": 5.2, "who": "Michelle Spencer", "text": "I can only reach you through the old station. Every piece of it you bring back, I come in clearer.", "v": "m"}, {"t": 29.4, "d": 4.4, "who": "Michelle Spencer", "text": "When the sun comes up, I go quiet for another ten years.", "v": "m"}, {"t": 34.4, "d": 6.6, "who": null, "text": "Michelle Spencer. Missing since March 3, 1986.", "v": "card"}], "sfx": null}, {"id": 2, "title": "Night Tide, 9:13 PM", "dur": 38, "shots": [{"art": "wnhc-1986", "t": 0, "kb": [1.0, 1.07, 0, 0, -1, 0]}, {"art": "michelle-1986", "t": 11.5, "kb": [1.0, 1.06, 0, 0, 1, -1]}, {"art": "scene-transmitter", "t": 30, "kb": [1.0, 1.06, 0, 0, 0, 1]}], "lines": [{"t": 0.5, "d": 2.4, "who": "Aircheck - March 3, 1986", "text": "[tape hiss, a song fading out]", "v": "fx"}, {"t": 3.1, "d": 6.4, "who": "Michelle, on the 1986 tape", "text": "Nine-thirteen on Night Tide. Stay with me, Marrow Bay, because after this record I have news I've been sitting on all week-", "v": "tape"}, {"t": 9.8, "d": 1.8, "who": null, "text": "[the tape warps into static]", "v": "fx"}, {"t": 12.0, "d": 5.2, "who": "Michelle Spencer", "text": "New York wanted me. Coast to coast. I was going to tell the whole town at nine-twenty.", "v": "m"}, {"t": 17.6, "d": 4.8, "who": "Michelle Spencer", "text": "Only a few people knew. One of them didn't want me going anywhere.", "v": "m"}, {"t": 22.8, "d": 5.0, "who": "Michelle Spencer", "text": "I never made nine-twenty. At nine-fourteen the board went dead in my hands.", "v": "m", "hit": true}, {"t": 28.4, "d": 8.0, "who": "Michelle Spencer", "text": "The fire started in the transmitter hall. When they built the new place, they walled it up behind the east corridor. Find it.", "v": "m"}], "sfx": null}, {"id": 3, "title": "Hall B", "dur": 38, "sfx": "door", "shots": [{"art": "scene-corridor-open", "t": 0, "kb": [1.0, 1.08, 0, 0, -1, 1]}, {"art": "michelle-1986", "t": 15, "kb": [1.06, 1.0, 1, -1, 0, 0]}, {"art": "scene-transmitter", "t": 27, "kb": [1.0, 1.06, 0, 0, 0, -1]}], "lines": [{"t": 0.5, "d": 3.0, "who": null, "text": "[the lock thunks back; the steel door drags open on ten years of dust]", "v": "fx"}, {"t": 4.0, "d": 4.6, "who": "Michelle Spencer", "text": "Hall B. Nobody has opened that door since the night I died.", "v": "m"}, {"t": 9.0, "d": 5.8, "who": "Michelle Spencer", "text": "Gordon changed the code the week they walled it up. Twenty-one hundred. Nine o'clock. My hour.", "v": "m", "hit": true}, {"t": 15.2, "d": 5.2, "who": "Michelle Spencer", "text": "He knew exactly what he was closing in. He just didn't want to look.", "v": "m"}, {"t": 20.8, "d": 5.6, "who": "Michelle Spencer", "text": "Everything is still in there. The racks. The cable. The meters stopped where the fire stopped them.", "v": "m"}, {"t": 26.8, "d": 9.2, "who": "Michelle Spencer", "text": "Bring my carrier back up - the way it was built - and I'll tell you how the lights went out.", "v": "m"}]}, {"id": 4, "title": "Point of Origin", "dur": 36, "shots": [{"art": "beat-fire", "t": 0, "kb": [1.0, 1.07, 0, 0, 1, 1]}, {"art": "scene-transmitter", "t": 20.5, "kb": [1.06, 1.0, -1, 0, 0, 0]}], "lines": [{"t": 0.5, "d": 2.6, "who": "88.7 FM", "text": "[the old transmitter hums awake; the signal sharpens]", "v": "fx"}, {"t": 3.4, "d": 6.0, "who": "Michelle Spencer", "text": "That's what they called lightning. A cable. Someone patched it in that night so the power would die.", "v": "m"}, {"t": 9.8, "d": 4.2, "who": "Michelle Spencer", "text": "The board went dark. Then my booth door opened.", "v": "m", "hit": true}, {"t": 14.4, "d": 5.6, "who": "Michelle Spencer", "text": "Someone was behind me. I never saw a face. I never saw anything again.", "v": "m"}, {"t": 20.6, "d": 5.4, "who": "Michelle Spencer", "text": "Gordon read that report. He took the lightning money and built The Bay on top of me.", "v": "m"}, {"t": 26.6, "d": 7.6, "who": "Michelle Spencer", "text": "My booth is below you. Under everything he built.", "v": "m"}], "sfx": "fire"}, {"id": 5, "title": "D.", "dur": 35, "shots": [{"art": "scene-sublevel", "t": 0, "kb": [1.0, 1.06, 0, 0, 0, 1]}, {"art": "beat-lovers", "t": 6.2, "kb": [1.0, 1.07, 0, 0, -1, 0]}, {"art": "por-daniel", "t": 24.8, "kb": [1.0, 1.05, 0, 0, 1, 0]}], "lines": [{"t": 0.5, "d": 2.6, "who": "88.7 FM", "text": "[the little lock clicks; old paper unfolds; the signal steadies]", "v": "fx"}, {"t": 3.4, "d": 2.6, "who": "Michelle Spencer", "text": "You found Danny's letters.", "v": "m"}, {"t": 6.4, "d": 5.2, "who": "Michelle Spencer", "text": "Daniel Reyes. Our music director. Nobody knew about us. That was the rule.", "v": "m", "hit": true}, {"t": 12.0, "d": 5.8, "who": "Michelle Spencer", "text": "Gordon would have fired him. And Viv - Viv would have told the whole town by morning.", "v": "m"}, {"t": 18.2, "d": 6.2, "who": "Michelle Spencer", "text": "He was going to wait for me at the Harbor Club. After the announcement, we'd leave together.", "v": "m"}, {"t": 24.8, "d": 3.8, "who": "Michelle Spencer", "text": "He told the papers he barely knew me.", "v": "m"}, {"t": 29.0, "d": 5.0, "who": "Michelle Spencer", "text": "...Was he really waiting?", "v": "m"}], "sfx": "tin"}, {"id": 6, "title": "June 18, 1988", "dur": 34, "shots": [{"art": "beat-wedding", "t": 0, "kb": [1.08, 1.0, 0, -1, 0, 0]}, {"art": "por-vivian", "t": 15.4, "kb": [1.0, 1.06, 0, 0, -1, 0]}, {"art": "scene-booth", "t": 27.4, "kb": [1.0, 1.06, 0, 0, 0, 1]}], "lines": [{"t": 0.5, "d": 2.4, "who": "88.7 FM", "text": "[the safe swings open; the signal crackles, unsteady]", "v": "fx"}, {"t": 3.2, "d": 3.4, "who": "Michelle Spencer", "text": "That's Danny. On the courthouse steps.", "v": "m"}, {"t": 7.0, "d": 2.2, "who": "Michelle Spencer", "text": "With Viv.", "v": "m", "hit": true}, {"t": 9.6, "d": 5.4, "who": "Michelle Spencer", "text": "Two years. That's how long it took him to marry my best friend.", "v": "m"}, {"t": 15.4, "d": 6.0, "who": "Michelle Spencer", "text": "She got my time slot. She got the New York offer after me. And she got him.", "v": "m"}, {"t": 21.8, "d": 5.2, "who": "Michelle Spencer", "text": "Who says he was at the Harbor Club that night? Only Danny.", "v": "m"}, {"t": 27.4, "d": 5.8, "who": "Michelle Spencer", "text": "Open my booth. Whatever happened, it happened in there.", "v": "m"}], "sfx": "safe"}, {"id": 7, "title": "Found", "dur": 30, "shots": [{"art": "scene-booth", "t": 0, "kb": [1.0, 1.08, 0, 0, 1, 2]}, {"art": "beat-compartment", "t": 4.2, "kb": [1.0, 1.06, 0, 0, 0, -1]}], "lines": [{"t": 0.5, "d": 3.2, "who": null, "text": "[the last bolt gives; the hatch lifts; dust drifts through the flashlight beam]", "v": "fx"}, {"t": 4.2, "d": 2.6, "who": null, "text": "[88.7 goes silent - then, very close]", "v": "fx", "hit": true}, {"t": 7.2, "d": 2.6, "who": "Michelle Spencer", "text": "You found me.", "v": "m"}, {"t": 10.2, "d": 6.2, "who": "Michelle Spencer", "text": "Ten years under his floor. Under their new studio. Under all their anniversary specials.", "v": "m"}, {"t": 16.8, "d": 4.6, "who": "Michelle Spencer", "text": "Say my name on the air. Say it where it belongs.", "v": "m"}, {"t": 21.8, "d": 6.6, "who": "Michelle Spencer", "text": "Then say who did this. Everything you need is in this booth.", "v": "m"}], "sfx": "hatch"}, {"id": 8, "title": "The Last Broadcast", "dur": 50, "shots": [{"art": "beat-doorway", "t": 0, "kb": [1.0, 1.06, 0, 0, 0, -1]}, {"art": "scene-booth", "t": 21, "kb": [1.06, 1.0, 0, 1, 0, 0]}, {"art": "dawn", "t": 37.4, "kb": [1.0, 1.06, 0, 0, 0, -1]}], "lines": [{"t": 0.5, "d": 3.2, "who": "Michelle's recorder - 9:14 PM, March 3, 1986", "text": "[the board dies; rain on glass; the booth door opens]", "v": "fx"}, {"t": 4.0, "d": 3.8, "who": "Michelle, on the tape", "text": "Who's there? ...Viv? The lights just went-", "v": "tape"}, {"t": 8.2, "d": 5.0, "who": "Vivian, on the tape", "text": "You were going to tell them tonight. New York. And Danny.", "v": "viv"}, {"t": 13.6, "d": 3.8, "who": "Michelle, on the tape", "text": "I found your note to him, Viv. Put that down-", "v": "tape"}, {"t": 17.6, "d": 3.0, "who": null, "text": "[a heavy crash - then only the tape running]", "v": "fx", "hit": true}, {"t": 21.0, "d": 7.6, "who": "What happened", "text": "Vivian patched the transmitter to start the fire and kill the power. In the dark she struck Michelle with the mic stand and hid her in the covered compartment under the booth floor.", "v": "card"}, {"t": 29.0, "d": 7.8, "who": "What happened", "text": "Gordon took the lightning money and sealed the booth without looking inside. Daniel waited at the Harbor Club - and married the woman who killed her.", "v": "card"}, {"t": 37.6, "d": 4.8, "who": "Michelle Spencer", "text": "It's getting light. Thank you for staying on the air with me.", "v": "m"}, {"t": 43.0, "d": 6.0, "who": "Michelle Spencer", "text": "This is Michelle Spencer, eighty-eight point seven. Good night, Marrow Bay.", "v": "m"}], "sfx": "final"}];</script>

<script>/* Dead Air - shared device widgets (TV modal + phone operator panel). */

function init(ui){

function render(dev, S, ui){

/* op handler: send(kind,data,cb), redraw() */
function handle(dev, op, ui, send, redraw, fx){
  init(ui); fx = fx || {};
  const [a,b,c] = op.split(":");
  if(a==="tune"){ ui.freq = Math.min(108, Math.max(87.5, Math.round((ui.freq + parseFloat(b))*10)/10)); fx.click&&fx.click(); redraw(); return; }
  if(a==="lock"){ send("device",{dev:"tuner",freq:ui.freq}); return; }
  if(a==="reel"){ ui.reel=b; redraw(); return; }
  if(a==="speed"){ ui.speed=b; redraw(); return; }
  if(a==="rewind"){ ui.rewind=!ui.rewind; redraw(); return; }
  if(a==="play"){ send("device",{dev:"reels",reel:ui.reel,speed:ui.speed,rewind:ui.rewind}); return; }
  if(a==="patch"){ ui.patch[b]=c||""; fx.click&&fx.click(); redraw(); return; }
  if(a==="power"){ send("device",{dev:"patch",patch:ui.patch}); return; }
  if(a==="br"){
    const s = brState(ui.seq); ui.seq.push(b+":"+(s[b]?"off":"on")); fx.click&&fx.click(); redraw();
    if(b==="main" && !s[b]){ const seq = ui.seq.slice(); send("device",{dev:"breakers",seq}, j=>{ if(!j.ok){ ui.seq=[]; redraw(); } }); }
    return;
  }
  if(a==="brreset"){ ui.seq=[]; redraw(); return; }
  if(a==="key"){
    if(b==="clr") ui.code="";
    else if(b==="ok"){ send("device",{dev:"safe",code:ui.code}, j=>{ if(!j.ok){ ui.code=""; redraw(); } }); return; }
    else if(ui.code.length<4) ui.code+=b;
    fx.click&&fx.click(); redraw(); return;
  }
  if(a==="bolt"){
    if(ui.bolts.indexOf(b)<0) ui.bolts.push(b); fx.click&&fx.click(); redraw();
    if(ui.bolts.length===4){ const seq=ui.bolts.slice(); send("device",{dev:"hatch",seq}, j=>{ if(!j.ok){ ui.bolts=[]; redraw(); } }); }
    return;
  }
  if(a==="boltreset"){ ui.bolts=[]; redraw(); return; }
  if(a==="lv"){ const lv=isoLv(ui,dev); const i=+b; lv[i]=Math.max(0,Math.min(4,lv[i]+(+c))); fx.click&&fx.click(); redraw(); return; }
  if(a==="isolate"){ send("device",{dev:b, levels:isoLv(ui,b).slice()}); return; }
  if(a==="tap"){ ui.panel=+b; ui.taps[b]=Date.now(); fx.knock&&fx.knock(+b===4); redraw(); return; }
  if(a==="pry"){ send("device",{dev:"wall", panel:ui.panel}); return; }
  if(a==="dkey"){
    if(b==="clr") ui.code="";
    else if(b==="ok"){ send("device",{dev:"door",code:ui.code}, j=>{ if(!j.ok){ ui.code=""; redraw(); } }); return; }
    else if(ui.code.length<4) ui.code+=b;
    fx.click&&fx.click(); redraw(); return;
  }
  if(a==="tw"){ ui.tin[+b]=(ui.tin[+b]+(+c)+10)%10; fx.click&&fx.click(); redraw(); return; }
  if(a==="tinopen"){ send("device",{dev:"tin",code:ui.tin.join("")}); return; }
  if(a==="cf"){ ui.cfreq=Math.min(108,Math.max(87.5,Math.round((ui.cfreq+parseFloat(b))*10)/10)); fx.click&&fx.click(); redraw(); return; }
  if(a==="pw"){ ui.power=b; fx.click&&fx.click(); redraw(); return; }
  if(a==="cs"){
    if(b==="fil"){ if(!ui.cseq.includes("fil")){ ui.cseq.push("fil"); if(ui.cseq.length===1) ui.readyAt=Date.now()+3500; setTimeout(redraw,3600); } fx.click&&fx.click(); redraw(); return; }
    if(b==="plate"){ const seq=ui.cseq.concat(["plate"]); const ready=ui.cseq[0]==="fil" && ui.readyAt && Date.now()>=ui.readyAt;
      send("device",{dev:"carrier",freq:ui.cfreq,power:ui.power,seq,ready}, j=>{ if(!j.ok){ ui.cseq=[]; ui.readyAt=0; redraw(); } }); return; }
  }
  if(a==="creset"){ ui.cseq=[]; ui.readyAt=0; redraw(); return; }
  if(a==="who"){ ui.who=b; ui.proof=""; redraw(); return; }
  if(a==="proof"){ ui.proof=b; redraw(); return; }
  if(a==="accuse"){ send("accuse",{who:ui.who, proof:ui.proof}); return; }
}
function drawTune(cv, freq, t){
  if(!cv) return; const g=cv.getContext("2d"), W=cv.width, H=cv.height;
  const dist = Math.min(1, Math.abs(freq-88.7)/1.2); // 0 = locked on
  g.fillStyle="#070b10"; g.fillRect(0,0,W,H); g.strokeStyle= dist<0.05 ? "#e8a33d" : "#5db8d6"; g.lineWidth=2; g.beginPath();
  for(let x=0;x<W;x++){
    const n = (Math.sin(x*12.9898+t*37.7)*43758.5453)%1;
    const clean = Math.sin(x/9 + t*6)*Math.sin(x/53 + t*1.3);
    const y = H/2 + (H*0.42)*( dist*n + (1-dist)*0.8*clean );
    x? g.lineTo(x,y) : g.moveTo(x,y);
  }
  g.stroke();
}
function hash(n){ const x=Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function bandAmp(kind, t){
  if(kind==="storm") return Math.max(0,0.45+0.4*Math.sin(t*0.9)+0.25*Math.sin(t*0.37+1))*(0.75+0.25*hash(Math.floor(t*30)));
  if(kind==="bleed"||kind==="music"){ const ph=(t*2)%1; return (ph<0.18?0.9:0.25)+0.05*hash(Math.floor(t*40)); }
  if(kind==="hiss") return 0.42+0.06*hash(Math.floor(t*60));
  if(kind==="hum") return 0.3+0.02*Math.sin(t*50);
  if(kind==="room"){ const k=Math.floor(t/1.7), ph=t-k*1.7; return (hash(k)>0.35 && ph<0.12) ? 0.95 : 0.03; }
  if(kind==="voice"||kind==="voice2"){ const k=Math.floor(t*5), pause=hash(Math.floor(t/1.3)+(kind==="voice2"?50:0))<0.28; const ph=t*5-k; return pause?0.04:(0.35+0.6*hash(k+(kind==="voice2"?99:0)))*Math.sin(Math.PI*ph); }
  return 0;
}
function drawIso(root, dev, ui, t){
  const I=window.CASE.ISO[dev]; if(!I||!root) return; const lv=isoLv(ui,dev);
  root.querySelectorAll("canvas.scope").forEach(cv=>{
    const i=+cv.getAttribute("data-band"), kind=I.bands[i][1], g=cv.getContext("2d"), W=cv.width, H=cv.height;
    g.fillStyle="#070b10"; g.fillRect(0,0,W,H);
    const a=0.25+0.75*(lv[i]/4); g.fillStyle=lv[i]===4?"rgba(232,163,61,"+a+")":"rgba(93,184,214,"+a+")";
    for(let x=0;x<W;x+=5){ const tt=t-(W-x)/120; const v=Math.max(0.02,Math.min(1,bandAmp(kind,tt))); const h=v*H*0.9; g.fillRect(x,(H-h)/2,3,h); }
  });
  const cap=root.querySelector(".isocap[data-iso='"+dev+"']");
  if(cap){ const ok=lv.every((v,i)=>v===I.target[i]);
    const txt = ok ? I.garbled : I.garbled.split("").map((ch,j)=>ch===" "?" ":(hash(j+Math.floor(t*6))<0.8?"~#%*=/".charAt(Math.floor(hash(j*7+Math.floor(t*6))*6)):ch)).join("");
    if(cap._t!==txt){ cap._t=txt; cap.textContent=txt; cap.classList.toggle("clear",ok); } }
}
function drawRings(root, ui, t){
  if(!root) return;
  root.querySelectorAll("canvas.ring").forEach(cv=>{
    const n=+cv.getAttribute("data-ring"), g=cv.getContext("2d"), W=cv.width, H=cv.height, t0=ui.taps&&ui.taps[n];
    g.fillStyle="#070b10"; g.fillRect(0,0,W,H); if(!t0) return;
    const el=(Date.now()-t0)/1000, decay = n===4?1.8:0.18;
    g.strokeStyle=n===ui.panel?"#e8a33d":"#5db8d6"; g.lineWidth=2; g.beginPath();
    for(let x=0;x<W;x++){ const tt=x/W*2.2; const amp= tt>el?0:Math.exp(-tt/decay); const y=H/2+ (H*0.42)*amp*Math.sin(tt*(n===4?38:90)); x?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
  });
}
return {TITLES, render, handle, drawTune, drawIso, drawRings, bandAmp, brState};
})();
</script>
<script>/* Dead Air - phone companion: private evidence board + machine operator */
(function(){
const $=(s,r)=>(r||document).querySelector(s);
const app=$("#papp"), toastEl=$("#toast"), C=window.CASE, D=window.DEVICES;
let CID=localStorage.getItem("da_cid"); if(!CID){ CID="p-"+Math.random().toString(36).slice(2,12); localStorage.setItem("da_cid",CID); }
let S=null, ME=null, lastNotice=0, lastEvent=0, BEATS=null, lastKey="";
let ui={ev:null, dev:{}};
const SESSION=new URLSearchParams(location.search).get("s")||"";
let conn=null, peer=null, rid=0, pending={}, linkState="connecting";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
BEATS=window.DA_BEATS||null; if(!BEATS) fetch("beats.json").then(r=>r.json()).then(b=>{ BEATS=b; lastKey=""; render(); }).catch(()=>{});
const beatById=n=>BEATS&&BEATS.find(x=>x.id===n);
function fmtTime(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function toast(t){ toastEl.textContent=t; toastEl.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove("on"),Math.max(4200,t.length*55)); }
function api(kind,data,cb){ if(!conn||!conn.open){ toast("Not connected to the TV yet."); return; } const id=++rid; if(cb) pending[id]=cb; conn.send({t:"act",rid:id,kind,data:data||{}}); }
function connect(name){
  if(!SESSION){ linkState="nosession"; renderLink(); return; }
  if(typeof Peer!=="function"){ linkState="failed"; renderLink(); return; }
  if(!peer || peer.destroyed){ peer=new Peer({debug:1}); peer.on("error",e=>{ if(!S){ linkState="failed"; renderLink(); } }); }
  const go=()=>{ conn=peer.connect(SESSION,{reliable:true});
    conn.on("open",()=>{ linkState="open"; const nm=name||localStorage.getItem("da_name"); if(nm) conn.send({t:"hello",cid:CID,name:nm}); else renderJoin(); });
    conn.on("data",m=>{ if(!m) return;
      if(m.t==="welcome"){ ME=m.player; apply(m.st); }
      else if(m.t==="full"){ toast("Six phones is a full house."); }
      else if(m.t==="state"){ apply(m.st); }
      else if(m.t==="res"){ const f=pending[m.rid]; delete pending[m.rid]; if(f) f(m.res||{}); } });
    conn.on("close",()=>{ linkState="lost"; renderLink(); setTimeout(()=>connect(),2500); }); };
  if(peer.open) go(); else peer.on("open",go);
}
function renderLink(){
  if(S && linkState==="open") return;
  const msg={connecting:"Connecting to the TV...",nosession:"Scan the code on the TV to join.",failed:"Couldn't reach the TV. Check the screen is still on the title or game, then scan again.",lost:"Lost the TV. Reconnecting..."}[linkState]||"";
  if(S && linkState==="lost"){ toast(msg); return; }
  app.innerHTML='<div class="pwrap"><div class="ptitle"><div class="kicker">Casebound</div><h1 style="margin:8px 0 2px">DEAD AIR</h1><div class="small">Marrow Bay - phone</div></div><div class="pcard"><p class="small">'+esc(msg)+'</p></div></div>';
}
function apply(st){
  if(S && st.version<S.version){ lastEvent=0; lastNotice=0; }
  const prev=S; S=st; ME=st.players.find(p=>p.client_id===CID)||ME;
  if(st.notice && st.notice.seq>lastNotice){ const first=prev===null; lastNotice=st.notice.seq; if(!first) toast(st.notice.text); }
  if(st.event && st.event.seq>lastEvent){ const first=prev===null; lastEvent=st.event.seq;
    if(!first){ const k=st.event.kind;
      if(k==="reset"){ ui.ev=null; ui.dev={}; }
      if(k==="scene_started"){ ui.dev={}; }
      if(k.startsWith("hint:")){ const [,dev,t]=k.split(":"); const h=C.HINTS[dev]; if(h) toast(h[+t]); }
      if(k.startsWith("evidence_found") && navigator.vibrate) navigator.vibrate(12);
    } }
  render();
}
function joined(){ return !!(S && S.players.find(p=>p.client_id===CID)); }
function iHold(){ return S.control.holder===CID; }
function holderName(){ const p=S.players.find(p=>p.client_id===S.control.holder); return p?p.name:null; }
function render(){
  if(!S) return;
  const key=[joined(),S.phase,S.scene,JSON.stringify(S.evidence),S.control.holder,S.beats_heard.join(","),ui.ev,JSON.stringify(ui.dev),S.players.length].join("|");
  const tl=$("#tl"); if(tl) tl.textContent=fmtTime(S.timer_ms);
  if(key===lastKey) return; lastKey=key;
  if(!joined()) return renderJoin();
  if(ui.ev) return renderEv();
  renderHome();
}
function renderJoin(){
  app.innerHTML='<div class="pwrap"><div class="ptitle"><div class="kicker">Casebound</div><h1 style="margin:8px 0 2px">DEAD AIR</h1><div class="small">Marrow Bay - phone</div></div>'+
   '<div class="pcard"><b>Join the late shift</b><p class="small" style="margin:6px 0 12px">Your phone is your notebook. When it\'s your turn, you can work the machines from here.</p>'+
   '<input class="txt" id="nm" placeholder="Your name" maxlength="18" value="'+esc(localStorage.getItem("da_name")||"")+'"><div style="height:10px"></div>'+
   '<button class="bigbtn" id="go" style="width:100%">Join</button></div></div>';
  $("#go").onclick=()=>{ const name=$("#nm").value.trim(); localStorage.setItem("da_name",name); if(conn&&conn.open) conn.send({t:"hello",cid:CID,name}); };
}
function renderHome(){
  const sc=C.SCENES[S.scene]||C.SCENES[0];
  const line={boot:"The TV is on the title screen.",briefing:"Briefing on the TV.",play:sc.goal,beat:"A transmission is coming through - watch and listen on the TV.",ending:"Off the air. Thanks for playing."}[S.phase]||"";
  let ev='';
  C.SCENES.forEach((s,i)=>{ const items=Object.keys(C.EV).filter(k=>C.EV[k].scene===i&&S.evidence[k]);
    if(items.length) ev+='<div class="sect">'+esc(s.name)+'</div>'+items.map(k=>'<button class="evitem" data-ev="'+k+'"><span><b>'+esc(C.EV[k].name)+'</b><span>'+esc(C.EV[k].body.slice(0,70))+'...</span></span></button>').join(""); });
  let tx='';
  if(BEATS && S.beats_heard.length) tx='<div class="sect">Transmissions on 88.7</div>'+S.beats_heard.map(n=>{ const b=beatById(n); return '<div class="pcard"><b>'+n+'. '+esc(b.title)+'</b><p class="small" style="margin-top:6px">'+b.lines.map(l=>(l.who?esc(l.who)+": ":"")+esc(l.text)).join("<br>")+'</p></div>'; }).join("");
  let op='';
  if(iHold()){
    const dev=S.step, sd=dev && ((C.NEEDS[dev]||[[]])[0]).every(k=>S.evidence[k]);
    if(S.phase==="play" && dev && dev!=="accuse"){ op='<div class="sect">You are operating: '+esc(D.TITLES[dev])+'</div><div class="pcard">'+(sd?D.render(dev,S,ui.dev):'<span class="small">You haven\'t found enough to work the '+esc(D.TITLES[dev].toLowerCase())+' yet. Look around the room on the TV.</span>')+'</div>'; }
    else if(S.phase==="play" && dev==="accuse"){ op='<div class="sect">Name who did it</div><div class="pcard">'+D.render("accuse",S,ui.dev)+'</div>'; }
    else op='<div class="sect">You are operating</div><div class="pcard"><span class="small">Nothing to operate right now.</span></div>';
  }
  app.innerHTML='<div class="pwrap"><div class="timerline"><span>'+esc(ME?ME.name:"")+'</span><b id="tl">'+fmtTime(S.timer_ms)+'</b></div>'+
   '<div class="pcard"><b>'+esc(S.phase==="play"||S.phase==="beat"?sc.name:"Dead Air at Marrow Bay")+'</b><p class="small" style="margin-top:4px">'+esc(line)+'</p></div>'+
   op+'<div class="evboard">'+(ev||'<div class="pcard"><span class="small">Nothing pinned yet. Look around the room on the TV.</span></div>')+'</div>'+tx+'</div>'+
   '<div class="ctlbar">'+(iHold()?'<span class="small grow">You are operating</span><button class="bigbtn alt" id="rel">Release</button>'
     :'<span class="small grow">'+(holderName()?esc(holderName())+" is operating":"No one is operating")+'</span><button class="bigbtn" id="claim">Take control</button>')+
   (S.difficulty==="mastermind"?'':'<button class="bigbtn alt" id="hint">Ollie</button>')+'</div>';
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{ ui.ev=b.getAttribute("data-ev"); lastKey=""; render(); });
  const c=$("#claim"), r=$("#rel"), h=$("#hint");
  if(c) c.onclick=()=>api("claim"); if(r) r.onclick=()=>api("release"); if(h) h.onclick=()=>api("hint");
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ api("touch"); const dev=b.closest("[data-dev]").getAttribute("data-dev");
    D.handle(dev,b.getAttribute("data-d"),ui.dev,(k,d,cb)=>api(k,d,cb),()=>{ lastKey=""; render(); },{}); });
  anim();
}
function anim(){ cancelAnimationFrame(anim._r); const f=(now)=>{ const t=now/1000; const cv=$(".tunewave"); if(cv) D.drawTune(cv, ui.dev.freq||101.3, t); const iso=$(".device[data-dev^=iso]"); if(iso) D.drawIso(iso, iso.getAttribute("data-dev"), ui.dev, t); if($("canvas.ring")) D.drawRings(app, ui.dev, t); if(cv||iso||$("canvas.ring")) anim._r=requestAnimationFrame(f); }; anim._r=requestAnimationFrame(f); }
function renderEv(){
  const e=C.EV[ui.ev];
  app.innerHTML='<div class="pwrap">'+(e.art?'<div class="pcard" style="padding:0;overflow:hidden"><img src="'+e.art+'" style="width:100%;display:block"></div>':"")+
   '<div class="pcard"><div class="small" style="letter-spacing:.2em;text-transform:uppercase;color:var(--amber)">'+esc(C.SCENES[e.scene].name)+'</div><b style="display:block;margin:6px 0 10px;font-size:18px">'+esc(e.name)+'</b>'+
   '<div class="paper '+e.kind+'">'+nl(e.body)+'</div><p class="small" style="margin-top:10px"><i>'+esc(e.note)+'</i></p></div>'+
   '<button class="bigbtn alt" id="back" style="width:100%">Back</button></div>';
  $("#back").onclick=()=>{ ui.ev=null; lastKey=""; render(); };
}
renderLink(); connect();
})();
</script>
